name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite:
    name: PHPUnit SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
      - name: Run full test suite
        run: php vendor/bin/phpunit --do-not-cache-result

  mariadb:
    name: PHPUnit MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: tienda_ci
          MARIADB_USER: tienda_ci
          MARIADB_PASSWORD: ci-test-password
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tienda_ci
      DB_USERNAME: tienda_ci
      DB_PASSWORD: ci-test-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
      # La suite histórica completa se ejecuta en SQLite: varias pruebas antiguas
      # dependen de IDs fijos que MariaDB no reinicia al revertir una transacción.
      - name: Test size constraints, ordering and variant initialization
        run: php vendor/bin/phpunit --do-not-cache-result --filter 'SizeName|SizeOrdering|VariantInitialization|GridConditionPrecedence'
