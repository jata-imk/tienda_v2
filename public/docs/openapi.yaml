                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Tipos de moneda obtenidos.'
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        status: activo
                        name: 'Pesos Mexicanos'
                        code: MXN
                        symbol: $
                        dateCreation: '2024-01-01 00:00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        status:
                          type: string
                          example: activo
                        name:
                          type: string
                          example: 'Pesos Mexicanos'
                        code:
                          type: string
                          example: MXN
                        symbol:
                          type: string
                          example: $
                        dateCreation:
                          type: string
                          example: '2024-01-01 00:00:00'
