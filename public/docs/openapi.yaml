                      name:
                        type: string
                        example: 'Pesos Mexicanos'
                      code:
                        type: string
                        example: MXN
                      symbol:
                        type: string
                        example: $
                      dateCreation:
                        type: string
                        example: '2024-01-01 00:00:00'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 404
                  status: 'Not Found'
                  message: 'Tipo de moneda no encontrado.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 404
                  status:
                    type: string
                    example: 'Not Found'
                  message:
                    type: string
                    example: 'Tipo de moneda no encontrado.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Configuración
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                code:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: ngzmiy
                symbol:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: vdljni
                status:
                  type: string
                  description: ''
                  example: inactivo
                  enum:
                    - activo
                    - inactivo
      security: []
