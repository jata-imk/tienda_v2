openapi: 3.0.3
info:
  title: 'TiendaBackend API Documentation'
  description: 'Backend API del sistema de ventas Tienda. Módulo de autenticación y gestión de sesiones.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Autenticación
    description: "\nEndpoints para el manejo de sesiones de usuario."
  -
    name: Configuración
    description: "\nCatálogos y configuración del sistema. Todos los endpoints requieren JWT y rol administrador."
  -
    name: Inventario
    description: "\nGestión del inventario de productos. Todos los endpoints requieren JWT y rol administrador."
  -
    name: Usuarios
    description: "\nGestión de usuarios del sistema. Todos los endpoints requieren JWT y rol administrador."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén tu token haciendo <b>POST /api/login</b> con tus credenciales. Luego pégalo aquí para probar los endpoints protegidos.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: 'Inicio de sesión'
      operationId: inicioDeSesin
      description: "Valida credenciales, gestiona la sesión y retorna un JWT válido por 24 horas\njunto con los datos del usuario y la empresa.\n\nSi el usuario ya tiene una sesión vigente con token activo, se reutiliza el mismo JWT.\nSi el token expiró, se genera uno nuevo y se cierra la sesión anterior."
      parameters: []
      responses:
        200:
          description: 'Login exitoso'
          content:
            application/json:
              schema:
                type: object
                example:
                  result: ok
                  message: 'Inicio de sesión exitoso'
                  data:
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    empresa:
                      nombre: 'Guayaberas Lopez Silva'
                      logo: null
                      modoOscuro: false
                      configImp: []
                      fechaUpdate: '2024-01-01 00:00:00'
                      settings:
                        grids: []
                    user:
                      nombre: Suriel
                      primerApellido: Dzul
                      segundoApellido: Dzul
                      usuario: suriel.dzul
                      email: dzulsuriel@gmail.com
                      tipoUsuario: '1'
                      permisos: []
                properties:
                  result:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: 'Inicio de sesión exitoso'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      empresa:
                        type: object
                        properties:
                          nombre:
                            type: string
                            example: 'Guayaberas Lopez Silva'
                          logo:
                            type: string
                            example: null
                            nullable: true
                          modoOscuro:
                            type: boolean
                            example: false
                          configImp:
                            type: array
                            example: []
                          fechaUpdate:
                            type: string
                            example: '2024-01-01 00:00:00'
                          settings:
                            type: object
                            properties:
                              grids:
                                type: array
                                example: []
                      user:
                        type: object
                        properties:
                          nombre:
                            type: string
                            example: Suriel
                          primerApellido:
                            type: string
                            example: Dzul
                          segundoApellido:
                            type: string
                            example: Dzul
                          usuario:
                            type: string
                            example: suriel.dzul
                          email:
                            type: string
                            example: dzulsuriel@gmail.com
                          tipoUsuario:
                            type: string
                            example: '1'
                          permisos:
                            type: array
                            example: []
        401:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Credenciales incorrectas'
                    type: object
                    example:
                      result: error
                      message: 'Contraseña incorrecta'
                      data: null
                    properties:
                      result:
                        type: string
                        example: error
                      message:
                        type: string
                        example: 'Contraseña incorrecta'
                      data:
                        type: string
                        example: null
                        nullable: true
                  -
                    description: 'Usuario inactivo o no existe'
                    type: object
                    example:
                      result: error
                      message: 'Usuario no encontrado o inactivo'
                      data: null
                    properties:
                      result:
                        type: string
                        example: error
                      message:
                        type: string
                        example: 'Usuario no encontrado o inactivo'
                      data:
                        type: string
                        example: null
                        nullable: true
        422:
          description: 'Campos faltantes'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The username field is required.'
                  errors:
                    username:
                      - 'The username field is required.'
                properties:
                  message:
                    type: string
                    example: 'The username field is required.'
                  errors:
                    type: object
                    properties:
                      username:
                        type: array
                        example:
                          - 'The username field is required.'
                        items:
                          type: string
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 'Nombre de usuario.'
                  example: suriel.dzul
                password:
                  type: string
                  description: 'Contraseña en texto plano.'
                  example: suriel2024
              required:
                - username
                - password
      security: []
  /api/tipos-iva:
    get:
      summary: 'Listar tipos de IVA'
      operationId: listarTiposDeIVA
      description: 'Retorna el catálogo completo de tipos de IVA disponibles.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Tipos de IVA obtenidos.'
                  data:
                    -
                      id: 1
                      name: general
                      description: 'General (base: 16%)'
                      dateCreation: '2024-01-01 00:00:00'
                    -
                      id: 2
                      name: tasa_producto
                      description: 'Tasa por producto'
                      dateCreation: '2024-01-01 00:00:00'
                    -
                      id: 3
                      name: cuota_producto
                      description: 'Cuota por producto'
                      dateCreation: '2024-01-01 00:00:00'
                    -
                      id: 4
                      name: no_aplica
                      description: 'No aplica'
                      dateCreation: '2024-01-01 00:00:00'
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Tipos de IVA obtenidos.'
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: general
                        description: 'General (base: 16%)'
                        dateCreation: '2024-01-01 00:00:00'
                      -
                        id: 2
                        name: tasa_producto
                        description: 'Tasa por producto'
                        dateCreation: '2024-01-01 00:00:00'
                      -
                        id: 3
                        name: cuota_producto
                        description: 'Cuota por producto'
                        dateCreation: '2024-01-01 00:00:00'
                      -
                        id: 4
                        name: no_aplica
                        description: 'No aplica'
                        dateCreation: '2024-01-01 00:00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: general
                        description:
                          type: string
                          example: 'General (base: 16%)'
                        dateCreation:
                          type: string
                          example: '2024-01-01 00:00:00'
      tags:
        - Configuración
  /api/impuestos-config:
    get:
      summary: 'Ver configuración de impuestos base'
      operationId: verConfiguracinDeImpuestosBase
      description: 'Retorna los porcentajes base de IVA, ISR e impuesto especial.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Configuración de impuestos obtenida.'
                  data:
                    iva: 16
                    isr: 10
                    impEsp: 0
                    dateCreation: '2024-01-01 00:00:00'
                    dateUpdate: null
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Configuración de impuestos obtenida.'
                  data:
                    type: object
                    properties:
                      iva:
                        type: integer
                        example: 16
                      isr:
                        type: integer
                        example: 10
                      impEsp:
                        type: integer
                        example: 0
                      dateCreation:
                        type: string
                        example: '2024-01-01 00:00:00'
                      dateUpdate:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Configuración
      security: []
    put:
      summary: 'Actualizar configuración de impuestos base'
      operationId: actualizarConfiguracinDeImpuestosBase
      description: 'Actualiza uno o más porcentajes base. Solo se modifican los campos enviados.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Configuración de impuestos actualizada.'
                  data:
                    iva: 8
                    isr: 10
                    impEsp: 0
                    dateCreation: '2024-01-01 00:00:00'
                    dateUpdate: '2024-01-02 00:00:00'
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Configuración de impuestos actualizada.'
                  data:
                    type: object
                    properties:
                      iva:
                        type: integer
                        example: 8
                      isr:
                        type: integer
                        example: 10
                      impEsp:
                        type: integer
                        example: 0
                      dateCreation:
                        type: string
                        example: '2024-01-01 00:00:00'
                      dateUpdate:
                        type: string
                        example: '2024-01-02 00:00:00'
      tags:
        - Configuración
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                iva:
                  type: number
                  description: 'optional Porcentaje IVA base (0-100).'
                  example: 8.0
                isr:
                  type: number
                  description: 'optional Porcentaje ISR base (0-100).'
                  example: 10.0
                imp_esp:
                  type: number
                  description: 'optional Porcentaje impuesto especial base (0-100).'
                  example: 0.0
      security: []
  /api/tipos-moneda:
    get:
      summary: 'Listar tipos de moneda'
      operationId: listarTiposDeMoneda
      description: ''
