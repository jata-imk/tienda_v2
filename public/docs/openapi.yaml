                      - idColor
                      - stock
                initialMovement:
                  type: object
                  description: ''
                  example: null
                  properties:
                    movementType:
                      type: string
                      description: 'This field is required when <code>initialMovement</code> is present.'
                      example: return
                      enum:
                        - entry
                        - sale
                        - adjustment
                        - return
                        - cancel
                    referenceType:
                      type: string
                      description: 'Must not be greater than 50 characters.'
                      example: w
                      nullable: true
                    referenceId:
                      type: integer
                      description: ''
                      example: 16
                      nullable: true
                    notes:
                      type: string
