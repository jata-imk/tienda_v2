                              example: 501
                            idProductVariant:
                              type: integer
                              example: 101
                            movementType:
                              type: string
                              example: adjustment
                            quantity:
                              type: integer
                              example: 2
                            previousStock:
                              type: integer
                              example: 8
                            newStock:
                              type: integer
                              example: 6
                            referenceType:
                              type: string
                              example: manual_adjustment
                            referenceId:
                              type: string
                              example: null
                              nullable: true
                            notes:
                              type: string
                              example: 'Ajuste por conteo físico'
                            idUser:
                              type: integer
                              example: 1
                            createdAt:
                              type: string
                              example: '2026-08-12 21:45:00'
                      totalStock:
                        type: integer
