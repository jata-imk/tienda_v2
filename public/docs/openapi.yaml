              - name
            items:
              type: string
        -
          in: query
          name: 'o[column]'
          description: 'Order by column.'
          example: name
          required: false
          schema:
            type: string
            description: 'Order by column.'
            example: name
        -
          in: query
          name: 'o[direction]'
          description: 'Order direction (asc/desc).'
          example: asc
          required: false
          schema:
            type: string
            description: 'Order direction (asc/desc).'
            example: asc
        -
          in: query
          name: 'w[status]'
          description: 'Filter by field value.'
          example: active
          required: false
          schema:
            type: string
            description: 'Filter by field value.'
            example: active
