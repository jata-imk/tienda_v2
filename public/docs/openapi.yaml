                    type: string
                    example: 'No active session found.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
  /api/catalogs:
    get:
      summary: 'List catalogs'
      operationId: listCatalogs
      description: "Returns all static catalogs (currencies, categories, colors, sizes,\nsize groups, user types, IVA types) in a single call. Same payload\nbundled inside the login response — use this endpoint to refresh the\nfrontend's local cache without requiring a new login."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Catalogs retrieved.'
                  data:
                    currencies: []
                    categories: []
                    colors: []
                    sizeGroups: []
                    sizes: []
                    userTypes: []
                    ivaTypes: []
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Catalogs retrieved.'
                  data:
                    type: object
                    properties:
                      currencies:
                        type: array
                        example: []
                      categories:
                        type: array
                        example: []
                      colors:
                        type: array
                        example: []
                      sizeGroups:
                        type: array
                        example: []
                      sizes:
                        type: array
                        example: []
                      userTypes:
                        type: array
                        example: []
                      ivaTypes:
                        type: array
                        example: []
      tags:
        - Catalogs
