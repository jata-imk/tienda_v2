                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 8
                impEsp:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 14
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - active
                    - inactive
                variants:
                  type: array
                  description: 'This field is required when <code>stockControl</code> is <code>true</code>.'
