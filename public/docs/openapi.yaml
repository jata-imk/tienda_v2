              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Tipos de moneda obtenidos.'
                  data:
                    -
                      id: 1
                      status: activo
                      name: 'Pesos Mexicanos'
                      code: MXN
                      symbol: $
                      dateCreation: '2024-01-01 00:00:00'
                properties:
