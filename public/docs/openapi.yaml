    post:
      summary: 'Create company info'
      operationId: createCompanyInfo
      description: "Single-row table: fails with 409 if a record already exists.\n`logo` accepts a base64 string (with or without data-URI prefix)."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 201
                  status: Created
                  message: 'Company info created.'
                  data: {  }
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 201
                  status:
                    type: string
                    example: Created
                  message:
                    type: string
                    example: 'Company info created.'
                  data:
                    type: object
                    properties: {  }
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 409
                  status: Conflict
                  message: 'Company info already exists.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 409
                  status:
                    type: string
                    example: Conflict
                  message:
                    type: string
                    example: 'Company info already exists.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                rfc:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                legalName:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                taxRegime:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                idCurrency:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the currencies table.'
                  example: 16
                  nullable: true
                logo:
                  type: string
                  description: 'Must match the regex /^(data:image\/(png|jpe?g|webp);base64,)?[A-Za-z0-9+\/=\s]+$/. Must not be greater than 2800000 characters.'
                  example: 'n'
                  nullable: true
                street:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                externalNumber:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                crossStreetOne:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: m
                  nullable: true
                crossStreetTwo:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                postalCode:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'y'
                  nullable: true
                neighborhood:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: d
                  nullable: true
                stockControl:
                  type: boolean
                  description: ''
                  example: false
                quantityIntegers:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 255.'
                  example: 5
                quantityDecimals:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 255.'
                  example: 19
                gridSettings:
                  type: object
                  description: ''
                  example: null
                  properties: {  }
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: inactive
                  enum:
                    - active
                    - inactive
              required:
                - name
