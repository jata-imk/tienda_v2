                  code: 200
                  status: OK
                  message: 'Tipo de moneda desactivado.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Tipo de moneda desactivado.'
                  data:
                    type: string
                    example: null
                    nullable: true
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 404
                  status: 'Not Found'
                  message: 'Tipo de moneda no encontrado.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 404
                  status:
                    type: string
                    example: 'Not Found'
                  message:
                    type: string
                    example: 'Tipo de moneda no encontrado.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Configuración
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'ID del tipo de moneda.'
        example: 1
        required: true
        schema:
          type: integer
