                  data:
                    movements:
                      -
                        id: 501
                        idProductVariant: 101
                        movementType: adjustment
                        quantity: 2
                        previousStock: 8
                        newStock: 6
                        referenceType: manual_adjustment
                        referenceId: null
                        notes: 'Ajuste por conteo físico'
                        idUser: 1
                        createdAt: '2026-08-12 21:45:00'
                    totalStock: 13
