          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                code:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: ngzmiy
                symbol:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: vdljni
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - active
                    - inactive
              required:
                - name
                - code
                - symbol
