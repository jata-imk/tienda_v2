openapi: 3.0.3
info:
  title: 'TiendaBackend API Documentation'
  description: 'Backend API del sistema de ventas Tienda. Módulo de autenticación y gestión de sesiones.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Authentication
    description: "\nSession management endpoints."
  -
    name: Catalogs
    description: ''
  -
    name: Configuration
    description: ''
  -
    name: Dashboard
    description: ''
  -
    name: Inventory
    description: ''
  -
    name: Users
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén tu token haciendo <b>POST /api/login</b> con tus credenciales. Luego pégalo aquí para probar los endpoints protegidos.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      description: "Validates credentials, manages session, returns a JWT valid for 24 hours.\nIf the user already has an active session, the same JWT is reused."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Login successful'
                  data:
                    token: eyJ...
                    companyInfo: {  }
                    user: {  }
                    catalogs:
                      currencies: []
                      categories: []
                      colors: []
                      sizeGroups: []
                      sizes: []
                      userTypes: []
                      ivaTypes: []
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ...
                      companyInfo:
                        type: object
                        properties: {  }
                      user:
                        type: object
                        properties: {  }
                      catalogs:
                        type: object
                        properties:
                          currencies:
                            type: array
                            example: []
                          categories:
                            type: array
                            example: []
                          colors:
                            type: array
                            example: []
                          sizeGroups:
                            type: array
                            example: []
                          sizes:
                            type: array
                            example: []
                          userTypes:
                            type: array
                            example: []
                          ivaTypes:
                            type: array
                            example: []
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 401
                  status: Unauthorized
                  message: 'Incorrect password'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 401
                  status:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: 'Incorrect password'
                  data:
                    type: string
                    example: null
                    nullable: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The userName field is required.'
                  errors: {  }
                properties:
                  message:
                    type: string
                    example: 'The userName field is required.'
                  errors:
                    type: object
                    properties: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: Username.
                  example: suriel.dzul
                password:
                  type: string
                  description: Password.
                  example: suriel2024
              required:
                - userName
                - password
      security: []
  /api/logout:
    delete:
      summary: Logout
      operationId: logout
      description: 'Revokes the current session token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
