        - Configuración
      security: []
    post:
      summary: 'Crear tipo de moneda'
      operationId: crearTipoDeMoneda
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 201
                  status: Created
                  message: 'Tipo de moneda creado.'
                  data:
                    id: 2
                    status: activo
                    name: 'Dólar Americano'
                    code: USD
                    symbol: $
                    dateCreation: '2024-01-01 00:00:00'
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 201
                  status:
                    type: string
                    example: Created
                  message:
                    type: string
                    example: 'Tipo de moneda creado.'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      status:
                        type: string
                        example: activo
                      name:
                        type: string
                        example: 'Dólar Americano'
                      code:
                        type: string
                        example: USD
                      symbol:
                        type: string
                        example: $
                      dateCreation:
                        type: string
                        example: '2024-01-01 00:00:00'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The code has already been taken.'
                  errors:
                    code:
                      - 'The code has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The code has already been taken.'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The code has already been taken.'
                        items:
                          type: string
      tags:
        - Configuración
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre de la moneda.'
                  example: 'Dólar Americano'
                code:
                  type: string
                  description: 'Código ISO (3 letras).'
                  example: USD
                symbol:
                  type: string
                  description: Símbolo.
                  example: $
                status:
                  type: string
                  description: 'optional Estado. Valores: activo, inactivo.'
                  example: activo
              required:
                - name
                - code
                - symbol
      security: []
