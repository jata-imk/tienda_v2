openapi: 3.0.3
info:
  title: 'TiendaBackend API Documentation'
  description: 'Backend API del sistema de ventas Tienda. Autenticación JWT y acceso para Administrador, Vendedor y Almacén.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Authentication
    description: "\nSession management endpoints."
  -
    name: Catalogs
    description: ''
  -
    name: Configuration
    description: ''
  -
    name: Dashboard
    description: ''
  -
    name: Inventory
    description: ''
  -
    name: Orders
    description: "\nPedidos de compra a proveedor. Estatus: `draft` → `confirmed` →\n`partially_received` → `received`; `draft` y `confirmed` (sin recepciones)\npueden pasar a `cancelled`. Recibir mercancia genera movimientos de\ninventario tipo `purchase`."
  -
    name: Users
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén tu token haciendo <b>POST /api/login</b> con tus credenciales. Luego pégalo aquí para probar los endpoints protegidos.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      description: "Validates credentials, manages session, returns a JWT valid for 24 hours.\nIf the user already has an active session, the same JWT is reused."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Login successful'
                  data:
                    token: eyJ...
                    companyInfo: {  }
                    user:
                      id: 1
                      firstName: Administrador
                      lastName: Sistema
                      userName: admin
                      email: admin@tienda.local
                      userType: 1
                      roleCode: administrator
                      roleName: Administrador
                    catalogs:
                      currencies: []
                      categories: []
                      colors: []
                      sizeGroups: []
                      sizes: []
                      userTypes:
                        -
                          id: 1
                          name: Administrador
                          code: administrator
                          status: active
                      ivaTypes:
                        -
                          id: 1
                          name: General
                        -
                          id: 2
                          name: 'Por producto'
                        -
                          id: 3
                          name: 'Cuota fija'
                        -
                          id: 4
                          name: 'No aplica'
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ...
                      companyInfo:
                        type: object
                        properties: {  }
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          firstName:
                            type: string
                            example: Administrador
                          lastName:
                            type: string
                            example: Sistema
                          userName:
                            type: string
                            example: admin
                          email:
                            type: string
                            example: admin@tienda.local
                          userType:
                            type: integer
                            example: 1
                          roleCode:
                            type: string
                            example: administrator
                          roleName:
                            type: string
                            example: Administrador
                      catalogs:
                        type: object
                        properties:
                          currencies:
                            type: array
                            example: []
                          categories:
                            type: array
                            example: []
                          colors:
                            type: array
                            example: []
                          sizeGroups:
                            type: array
                            example: []
                          sizes:
                            type: array
                            example: []
                          userTypes:
                            type: array
                            example:
                              -
                                id: 1
                                name: Administrador
                                code: administrator
                                status: active
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: Administrador
                                code:
                                  type: string
                                  example: administrator
                                status:
                                  type: string
                                  example: active
                          ivaTypes:
                            type: array
                            example:
                              -
                                id: 1
                                name: General
                              -
                                id: 2
                                name: 'Por producto'
                              -
                                id: 3
                                name: 'Cuota fija'
                              -
                                id: 4
                                name: 'No aplica'
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: General
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 401
                  status: Unauthorized
                  message: 'Incorrect password'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 401
                  status:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: 'Incorrect password'
                  data:
                    type: string
                    example: null
                    nullable: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The userName field is required.'
                  errors: {  }
                properties:
                  message:
                    type: string
                    example: 'The userName field is required.'
                  errors:
                    type: object
                    properties: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: Username.
                  example: admin
                password:
                  type: string
                  description: Password.
                  example: admin
              required:
                - userName
                - password
      security: []
  /api/logout:
    delete:
      summary: Logout
      operationId: logout
      description: 'Revokes the current session token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Session closed.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Session closed.'
                  data:
                    type: string
                    example: null
                    nullable: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: false
                  code: 401
                  status: Unauthorized
                  message: 'No active session found.'
                  data: null
                properties:
                  ok:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 401
                  status:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: 'No active session found.'
                  data:
                    type: string
                    example: null
                    nullable: true
      tags:
        - Authentication
  /api/catalogs:
    get:
      summary: 'List catalogs'
      operationId: listCatalogs
      description: "Returns all static catalogs (currencies, categories, colors, sizes,\nsize groups, user types, IVA types) in a single call. Same payload\nbundled inside the login response — use this endpoint to refresh the\nfrontend's local cache without requiring a new login."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Catalogs retrieved.'
                  data:
                    currencies: []
                    categories: []
                    colors: []
                    sizeGroups: []
                    sizes: []
                    userTypes:
                      -
                        id: 1
                        name: Administrador
                        code: administrator
                        status: active
                    ivaTypes:
                      -
                        id: 1
                        name: General
                      -
                        id: 2
                        name: 'Por producto'
                      -
                        id: 3
                        name: 'Cuota fija'
                      -
                        id: 4
                        name: 'No aplica'
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Catalogs retrieved.'
                  data:
                    type: object
                    properties:
                      currencies:
                        type: array
                        example: []
                      categories:
                        type: array
                        example: []
                      colors:
                        type: array
                        example: []
                      sizeGroups:
                        type: array
                        example: []
                      sizes:
                        type: array
                        example: []
                      userTypes:
                        type: array
                        example:
                          -
                            id: 1
                            name: Administrador
                            code: administrator
                            status: active
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: Administrador
                            code:
                              type: string
                              example: administrator
                            status:
                              type: string
                              example: active
                      ivaTypes:
                        type: array
                        example:
                          -
                            id: 1
                            name: General
                          -
                            id: 2
                            name: 'Por producto'
                          -
                            id: 3
                            name: 'Cuota fija'
                          -
                            id: 4
                            name: 'No aplica'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: General
      tags:
        - Catalogs
