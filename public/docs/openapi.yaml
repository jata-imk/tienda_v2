  /api/products/query:
    post:
      summary: 'Query products (POST)'
      operationId: queryProductsPOST
      description: "Supports two payload formats. Formato B (standard):\n`p.page` = row offset (0-indexed), `p.per_page`, `o.column`, `o.direction`, `w` = object.\nFormato A (compact):\n`p.r` = row offset, `p.s` = per_page, `o.field`, `o.type`, `w` = array of `{f, ao, v, lo}`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
                  code: 200
                  status: OK
                  message: 'Products retrieved.'
                  data:
                    items: []
                    total: 0
                    page: 1
                    pages: 1
                properties:
                  ok:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Products retrieved.'
                  data:
                    type: object
