                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Categories retrieved.'
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        example: []
                      total:
                        type: integer
                        example: 0
                      page:
                        type: integer
                        example: 1
                      pages:
                        type: integer
                        example: 1
      tags:
        - Inventory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  type: object
                  description: 'Pagination. `page`/`per_page` (row offset + size) or `r`/`s`.'
                  example: []
                  properties: {  }
                f:
                  type: array
                  description: 'Fields to return.'
                  example:
                    - id
                    - name
                  items:
                    type: string
                o:
                  type: object
                  description: 'Order. `column`+`direction` or `field`+`type`.'
                  example: []
                  properties: {  }
                w:
                  type: object|array
                  description: 'Where filters. Object for simple equality, array for advanced operators.'
                  example: architecto
                totalCount:
                  type: boolean
                  description: 'Include total count (default true).'
                  example: true
  /api/categories:
    get:
      summary: 'List categories'
      operationId: listCategories
      description: 'Supports filters: `p[page]`, `p[per_page]`, `f[]`, `o[column]`, `o[direction]`, `w[column]`, `totalCount`.'
