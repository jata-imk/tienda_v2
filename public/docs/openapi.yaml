                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Products retrieved.'
                  data:
                    type: array
                    example: []
      tags:
        - Inventory
