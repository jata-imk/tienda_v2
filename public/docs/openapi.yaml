                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                codeBar:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: v
                  nullable: true
                price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 42
                cost:
                  type: number
                  description: 'Must be at least 0.'
                  example: 37
