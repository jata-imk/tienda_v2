            type: string
            description: 'Order direction (asc/desc).'
            example: asc
        -
          in: query
          name: 'w[status]'
          description: 'Filter by status.'
          example: active
          required: false
          schema:
            type: string
            description: 'Filter by status.'
            example: active
        -
          in: query
          name: totalCount
          description: 'Return total count.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Return total count.'
            example: true
