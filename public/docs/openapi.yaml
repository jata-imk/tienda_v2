                  description: ''
                  example: true
                quantityIntegers:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 255.'
                  example: 5
                quantityDecimals:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 255.'
                  example: 8
                gridSettings:
                  type: object
                  description: ''
                  example: null
                  properties: {  }
                  nullable: true
                status:
                  type: string
